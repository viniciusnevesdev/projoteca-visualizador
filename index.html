<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#141923"><meta name="description" content="Projoteca Visualizador: catálogo local de projetos, ideias e decisões."><title>Projoteca Visualizador</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./assets/apple-touch-icon.png"><link rel="stylesheet" href="./styles.css"></head>
<body>
<div class="app">
 <header class="header">
  <div class="brand"><div class="logo" aria-hidden="true">▦</div><div><strong>Projoteca</strong><small>Visualizador · <span id="app-version">v0.1.0</span></small></div></div>
  <button id="btn-import-head" class="icon-btn" title="Importar ZIP" aria-label="Importar ZIP">↥</button>
 </header>
 <div class="environment" role="tablist" aria-label="Ambientes"><button class="env active" id="env-catalogo" data-env="catalogo" aria-selected="true">Catálogo</button><button class="env" id="env-programacao" data-env="programacao" aria-selected="false">Programação <span class="beta">Rascunho</span></button></div>
 <main id="main" tabindex="-1"></main>
 <nav class="bottom" aria-label="Navegação principal"><button data-tab="painel" class="selected"><span class="nav-ico">▦</span><span>Painel</span></button><button data-tab="projetos"><span class="nav-ico">▤</span><span>Projetos</span></button><button data-tab="pendencias"><span class="nav-ico">☷</span><span>Pendências</span></button><button data-tab="arquivos"><span class="nav-ico">▱</span><span>Arquivos</span></button></nav>
</div>
<input type="file" id="zip-file" accept=".zip,application/zip" hidden>
<dialog id="modal"><form id="modal-form" method="dialog"><div id="modal-content"></div><div class="modal-actions"><button type="button" id="modal-cancel" class="soft">Cancelar</button><button id="modal-save" type="submit" class="primary">Salvar</button></div></form></dialog>
<div role="status" aria-live="polite" id="toast"></div>
<script type="module" src="./app.js"></script>
</body></html>
